name: Build Flappy Frog Release AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        env:
          FLAPPY_KEYSTORE_BASE64: ${{ secrets.FLAPPY_KEYSTORE_BASE64 }}
        run: |
          set -e
          rm -rf android-build
          mkdir -p android-build
          unzip -q FlappyFrog_FIXED_SIGNING.zip -d android-build

          if [ -z "$FLAPPY_KEYSTORE_BASE64" ]; then
            echo "ERROR: FLAPPY_KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi

          printf '%s' "$FLAPPY_KEYSTORE_BASE64" | base64 --decode > android-build/flappyfrog-signing.jks
          test -s android-build/flappyfrog-signing.jks
          echo "Fixed Flappy Frog signing keystore installed."

      - name: Find Android Gradle project
        run: |
          set -e
          PROJECT_DIR=$(find android-build -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build Release AAB
        env:
          FLAPPY_KEYSTORE_PATH: ${{ github.workspace }}/android-build/flappyfrog-signing.jks
          FLAPPY_KEYSTORE_PASSWORD: ${{ secrets.FLAPPY_KEYSTORE_PASSWORD }}
          FLAPPY_KEY_ALIAS: ${{ secrets.FLAPPY_KEY_ALIAS }}
          FLAPPY_KEY_PASSWORD: ${{ secrets.FLAPPY_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$FLAPPY_KEYSTORE_PASSWORD" ] || [ -z "$FLAPPY_KEY_ALIAS" ] || [ -z "$FLAPPY_KEY_PASSWORD" ]; then
            echo "ERROR: One or more Flappy Frog signing secrets are missing."
            exit 1
          fi

          gradle -p "$PROJECT_DIR" bundleRelease --stacktrace

      - name: Verify Release AAB
        env:
          EXPECTED_SHA1: C8:21:F8:8B:20:CB:21:8B:BC:45:AE:AB:84:31:CD:22:49:74:DB:89
        run: |
          set -e

          AAB=$(find "$PROJECT_DIR" -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not created."
            exit 1
          fi

          echo "Release AAB created: $AAB"

          # AABs are signed JAR/ZIP containers. Verify the signing certificate.
          CERT_OUTPUT=$(jarsigner -verify -verbose -certs "$AAB" 2>&1 || true)
          echo "$CERT_OUTPUT" | tail -n 80

          ACTUAL_SHA1=$(printf '%s\n' "$CERT_OUTPUT" \
            | grep -E "SHA1:|SHA-1:" \
            | head -n 1 \
            | sed -E 's/.*SHA-1:|.*SHA1://' \
            | tr -d ' :' \
            | tr '[:lower:]' '[:upper:]')

          NORMALIZED_EXPECTED_SHA1=$(printf '%s' "$EXPECTED_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')

          if [ -n "$ACTUAL_SHA1" ] && [ "$ACTUAL_SHA1" != "$NORMALIZED_EXPECTED_SHA1" ]; then
            echo "ERROR: Release AAB signing certificate does not match the permanent Flappy Frog certificate."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          echo "Release AAB signing verification completed."
          echo "Expected permanent SHA-1: $EXPECTED_SHA1"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Frog-RELEASE-AAB
          path: android-build/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error

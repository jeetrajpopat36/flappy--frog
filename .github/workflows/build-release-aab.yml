name: Build Flappy Frog Release AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project and install fixed signing key
        env:
          FLAPPY_KEYSTORE_BASE64: ${{ secrets.FLAPPY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          rm -rf android-build
          mkdir -p android-build
          test -f FlappyFrog_FIXED_SIGNING.zip || {
            echo "ERROR: FlappyFrog_FIXED_SIGNING.zip is missing from the repository root."
            exit 1
          }
          unzip -q FlappyFrog_FIXED_SIGNING.zip -d android-build

          if [ -z "${FLAPPY_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: FLAPPY_KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$FLAPPY_KEYSTORE_BASE64" | base64 --decode > android-build/flappyfrog-signing.jks
          test -s android-build/flappyfrog-signing.jks

      - name: Find Android Gradle project
        run: |
          set -euo pipefail
          mapfile -t SETTINGS_FILES < <(find android-build -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print)
          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Android Gradle settings file; found ${#SETTINGS_FILES[@]}."
            printf '%s\\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi
          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build Release AAB
        env:
          FLAPPY_KEYSTORE_PATH: ${{ github.workspace }}/android-build/flappyfrog-signing.jks
          FLAPPY_KEYSTORE_PASSWORD: ${{ secrets.FLAPPY_KEYSTORE_PASSWORD }}
          FLAPPY_KEY_ALIAS: ${{ secrets.FLAPPY_KEY_ALIAS }}
          FLAPPY_KEY_PASSWORD: ${{ secrets.FLAPPY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FLAPPY_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${FLAPPY_KEY_ALIAS:-}" ] || \
             [ -z "${FLAPPY_KEY_PASSWORD:-}" ]; then
            echo "ERROR: One or more Flappy Frog signing secrets are missing."
            exit 1
          fi
          gradle -p "$PROJECT_DIR" bundleRelease --stacktrace

      - name: Verify AAB signature and permanent SHA-1
        env:
          EXPECTED_SHA1: C8:21:F8:8B:20:CB:21:8B:BC:45:AE:AB:84:31:CD:22:49:74:DB:89
        run: |
          set -euo pipefail
          mapfile -t AABS < <(find "$PROJECT_DIR" -type f -path "*/outputs/bundle/release/*.aab" -print)
          if [ "${#AABS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release AAB; found ${#AABS[@]}."
            printf '%s\\n' "${AABS[@]}"
            exit 1
          fi
          AAB="${AABS[0]}"
          test -s "$AAB"
          echo "AAB found: $AAB"

          # Fail if JAR signature verification fails; do not mask the exit status.
          if ! jarsigner -verify -certs "$AAB" > aab-signature-verification.log 2>&1; then
            cat aab-signature-verification.log
            echo "ERROR: AAB signature verification failed."
            exit 1
          fi
          cat aab-signature-verification.log
          if ! grep -Eiq 'jar verified\\.' aab-signature-verification.log; then
            echo "ERROR: jarsigner did not confirm a verified AAB."
            exit 1
          fi

          # keytool prints the signer certificate SHA1. An empty/unparseable value is a hard failure.
          CERT_OUTPUT="$(keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$AAB" 2>&1)" || {
            printf '%s\\n' "$CERT_OUTPUT"
            echo "ERROR: Could not extract the AAB signer certificate."
            exit 1
          }
          printf '%s\\n' "$CERT_OUTPUT"
          ACTUAL_SHA1="$(printf '%s\\n' "$CERT_OUTPUT" | awk -F': ' 'toupper($1) ~ /SHA1/ {print $2; exit}' | tr -d ' :\\r' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          if ! [[ "$ACTUAL_SHA1" =~ ^[0-9A-F]{40}$ ]]; then
            echo "ERROR: Could not parse a valid 40-character SHA-1 from the AAB certificate."
            echo "Parsed value: '$ACTUAL_SHA1'"
            exit 1
          fi
          if [ "$ACTUAL_SHA1" != "$EXPECTED_NORMALIZED" ]; then
            echo "ERROR: AAB signer does not match the permanent Flappy Frog certificate."
            echo "Expected: $EXPECTED_NORMALIZED"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi
          echo "SUCCESS: AAB signature and permanent SHA-1 both verified: $ACTUAL_SHA1"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Frog-RELEASE-AAB
          path: android-build/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error

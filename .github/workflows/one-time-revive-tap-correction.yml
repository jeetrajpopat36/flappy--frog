name: One-time Flappy Frog revive tap correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-revive-tap-correction.yml

permissions:
  contents: write

jobs:
  patch-revive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze the game after revive until the player taps
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, tempfile, os, re, subprocess

          html_entry = "FlappyFrog_Android_Foundation_v3/app/src/main/assets/flappy_frog.html"
          archive = Path("FlappyFrog_FIXED_SIGNING.zip")

          def patch_html(text, label):
              replacements = [
                  ("let paused=false,reviveStage=0,reviveOfferOpen=false,reviveAdPending=false,reviveToken=0;",
                   "let paused=false,reviveAwaitingTap=false,reviveStage=0,reviveOfferOpen=false,reviveAdPending=false,reviveToken=0;",
                   "revive state"),
                  ("function reset(){paused=false;reviveStage=0;",
                   "function reset(){paused=false;reviveAwaitingTap=false;reviveStage=0;",
                   "reset clears waiting state"),
                  ("function flap(){if(paused||reviveOfferOpen)return;if(state==='ready'){start();return}if(state==='playing'){bird.vy=FLAP;sound('flap');return}if(state==='dead'&&performance.now()-deathAt>650){reset();setTimeout(start,120)}}",
                   "function flap(){if(paused||reviveOfferOpen)return;if(state==='ready'){start();return}if(state==='playing'){if(reviveAwaitingTap){reviveAwaitingTap=false;hint.textContent='TAP TO FLAP'}bird.vy=FLAP;sound('flap');return}if(state==='dead'&&performance.now()-deathAt>650){reset();setTimeout(start,120)}}",
                   "first tap after revive"),
                  ("reviveAdPending=false;hideRevive();state='playing';paused=false;pauseBtn.classList.remove('hidden');",
                   "reviveAdPending=false;hideRevive();state='playing';paused=false;reviveAwaitingTap=true;pauseBtn.classList.remove('hidden');",
                   "revive waits for tap"),
                  ("function step(){if(state!=='playing'||paused)return;",
                   "function step(){if(state!=='playing'||paused||reviveAwaitingTap)return;",
                   "freeze physics until tap")
              ]
              for old, new, name in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{label}: {name}: expected exactly 1 match, found {count}")
                  text = text.replace(old, new)
              return text

          index = Path("index.html")
          index.write_text(patch_html(index.read_text(encoding="utf-8"), "root index"), encoding="utf-8")

          fd, temp_name = tempfile.mkstemp(suffix=".zip")
          os.close(fd)
          with zipfile.ZipFile(archive, "r") as src, zipfile.ZipFile(temp_name, "w") as dst:
              found = False
              for info in src.infolist():
                  data = src.read(info.filename)
                  if info.filename == html_entry:
                      data = patch_html(data.decode("utf-8"), "Android HTML").encode("utf-8")
                      found = True
                  dst.writestr(info, data)
          if not found:
              raise SystemExit("Android HTML entry not found in signing ZIP")
          os.replace(temp_name, archive)

          # Verify JS syntax in both actual deliverables.
          for name, source in [("root", index.read_text(encoding="utf-8"))]:
              for n, js in enumerate(re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", source, re.I)):
                  if js.strip():
                      check = Path(f"/tmp/flappy-{name}-{n}.js")
                      check.write_text(js, encoding="utf-8")
                      subprocess.run(["node", "--check", str(check)], check=True)
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit("Signing ZIP integrity check failed")
              source = z.read(html_entry).decode("utf-8")
              for n, js in enumerate(re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", source, re.I)):
                  if js.strip():
                      check = Path(f"/tmp/flappy-android-{n}.js")
                      check.write_text(js, encoding="utf-8")
                      subprocess.run(["node", "--check", str(check)], check=True)
          subprocess.run(["git", "diff", "--check"], check=True)
          PY
          git rm .github/workflows/one-time-revive-tap-correction.yml
          git add index.html FlappyFrog_FIXED_SIGNING.zip
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Hold gameplay until tap after revive"
          git push origin main

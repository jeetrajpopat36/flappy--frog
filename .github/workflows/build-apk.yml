name: Build Flappy Frog APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir -p android-build
          unzip -q FlappyFrog_FINAL_ANDROID_BROWSER_GOOGLE_REVIVE_FIXED.zip -d android-build

      - name: Show project files
        run: |
          echo "Android project:"
          find android-build -maxdepth 3 -type f | sort

      - name: Build Debug APK
        working-directory: android-build
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find android-build -type f -name "*.apk" -print

      - name: Print APK SHA-1 and SHA-256
        run: |
          APK=$(find android-build -type f -name "*.apk" | head -n 1)

          echo "APK: $APK"

          echo "===== SHA-1 ====="
          keytool -printcert -jarfile "$APK" | grep -i "SHA1"

          echo "===== SHA-256 ====="
          keytool -printcert -jarfile "$APK" | grep -i "SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Frog-FINAL-APK
          path: android-build/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

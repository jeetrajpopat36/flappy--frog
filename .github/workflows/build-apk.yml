name: Build Flappy Frog APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir -p android-build
          unzip -q FlappyFrog_FINAL_ANDROID_BROWSER_GOOGLE_REVIVE_FIXED.zip -d android-build

      - name: Find Android Gradle project
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR=$(find android-build -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle"
            echo "Extracted files:"
            find android-build -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project files
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "settings.gradle*" -o -name "build.gradle*" \) \
            -print

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Frog-FINAL-APK
          path: android-build/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

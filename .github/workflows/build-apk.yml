name: Build Flappy Frog APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir -p android-build
          unzip -q FlappyFrog_Android_Foundation_v3_READY.zip -d android-build

      - name: Build APK
        working-directory: android-build/FlappyFrog_Android_Foundation_v3
        run: gradle assembleDebug --stacktrace

      - name: Print APK certificate fingerprints
        run: |
          APK=$(find android-build/FlappyFrog_Android_Foundation_v3/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)

          echo "========================================"
          echo "FLAPPY FROG APK CERTIFICATE"
          echo "========================================"
          echo "APK: $APK"
          echo ""
          echo "SHA-1:"
          keytool -printcert -jarfile "$APK" | grep "SHA1:"
          echo ""
          echo "SHA-256:"
          keytool -printcert -jarfile "$APK" | grep "SHA256:"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Frog-debug-APK
          path: android-build/FlappyFrog_Android_Foundation_v3/app/build/outputs/apk/debug/*.apk
